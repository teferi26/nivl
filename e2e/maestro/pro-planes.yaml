# Planes de NIVL Pro contra un build REAL. Portado de
# scripts/screenshots/pro-review.yaml (rama chore/ios-screenshots-107).
#
# Diferencias con el original:
# Selectores revisados contra ProOffer en winter2/integracion @bc277ef (aviso
# de NIVL - Compras, fase 3): las filas se anuncian como «NIVL Pro anual.
# Suscripción anual de renovación automática, <precio> al año. …» y el CTA es
# «Activar NIVL Pro anual · <precio> al año» (ya no «/año»).
# - El original usaba un catálogo FICTICIO con precios fijos (12,99 / 99,99 /
#   29,99 / 299,00 / 249,00 €). Aquí los precios vienen de StoreKit/Play, así que
#   solo se exige que haya un precio, no un importe concreto. Anotar a mano los
#   importes que se vean en las capturas.
# - Se entra por Perfil → fila "NIVL Pro" (sirve con cuenta gratuita o de prueba).
# - Se comprueban los enlaces "Términos de uso" y "Política de privacidad".
#
# NUNCA pulsa comprar, restaurar, prueba gratuita ni consentimientos. Ver la
# pantalla de planes no acredita una compra sandbox (caso O-08 es manual).
# El fundador solo aparece si la tienda lo ofrece: su bloque es opcional.
appId: com.teferi.nivl
name: NIVL planes Pro (solo lectura)
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      notifications: deny
- openLink: nivl://pro
- extendedWaitUntil:
    notVisible: '^Cargando precios de la tienda$'
    timeout: 30000
# Si la tienda no devuelve los 5 productos, es FAIL de A6: no seguir.
- assertNotVisible: '^Algún plan no está disponible.*'
# Nivel Pro
- tapOn: '^NIVL Pro\. El coach en potencia estándar\.$'
- scrollUntilVisible:
    element:
      text: '^NIVL Pro mensual\. Suscripción mensual.*'
    direction: DOWN
- tapOn: '^NIVL Pro mensual\. Suscripción mensual.*'
- assertVisible: '^Activar NIVL Pro mensual · .+ al mes$'
- takeScreenshot: iap-review_nivl_pro_mensual
- scrollUntilVisible:
    element:
      text: '^NIVL Pro anual\. Suscripción anual.*'
    direction: UP
- tapOn: '^NIVL Pro anual\. Suscripción anual.*'
- assertVisible: '^Activar NIVL Pro anual · .+ al año$'
- takeScreenshot: iap-review_nivl_pro_anual
# Nivel Élite
- scrollUntilVisible:
    element:
      text: '^NIVL Élite\. El coach a máxima potencia, con modo profundo\.$'
    direction: UP
- tapOn: '^NIVL Élite\. El coach a máxima potencia, con modo profundo\.$'
- scrollUntilVisible:
    element:
      text: '^NIVL Élite mensual\. Suscripción mensual.*'
    direction: DOWN
- tapOn: '^NIVL Élite mensual\. Suscripción mensual.*'
- assertVisible: '^Activar NIVL Élite mensual · .+ al mes$'
- takeScreenshot: iap-review_nivl_elite_mensual
- scrollUntilVisible:
    element:
      text: '^NIVL Élite anual\. Suscripción anual.*'
    direction: UP
- tapOn: '^NIVL Élite anual\. Suscripción anual.*'
- assertVisible: '^Activar NIVL Élite anual · .+ al año$'
- takeScreenshot: iap-review_nivl_elite_anual
# El fundador solo sale mientras la tienda lo ofrezca.
- runFlow:
    when:
      visible: '^NIVL Élite fundador\. Suscripción anual.*'
    commands:
      - tapOn: '^NIVL Élite fundador\. Suscripción anual.*'
      - assertVisible: '^Activar NIVL Élite fundador · .+ al año$'
      - takeScreenshot: iap-review_nivl_elite_fundador
# Enlaces legales y restaurar: presencia (abrirlos sale de la app).
- scrollUntilVisible:
    element:
      text: '^Términos de uso$'
    direction: DOWN
- assertVisible: '^Restaurar compras$'
- assertVisible: '^Términos de uso$'
- assertVisible: '^Política de privacidad$'
- takeScreenshot: iap-review_legal
