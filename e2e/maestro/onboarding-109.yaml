# Reviewable simulator regression, existing NIVL_SHOTS demo ONLY.
# WRITES the demo's display name, general profile, fictitious book goal and letter.
# No new user, consent acceptance, purchase, trial, mission completion, XP or AI turn.
# Clean simulator installation != new-user onboarding: this demo already has age/onboarding accepted.
# Exact pinned source runs with OTA disabled only in the disposable simulator checkout.
# Native selectors/gestures require the first actual simulator run; this file is not execution evidence.
# Maestro 2.10 longPressOn = native 3s press; tapOn is shorter than the 1600ms signing threshold.
# Background after release is covered below. Background DURING hold remains physical/manual,
# separately covered by AppState component tests; sequential Maestro cannot interrupt its own gesture.
appId: com.teferi.nivl
name: NIVL 1.0.9 demo onboarding and cold reopen
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: deny
- runFlow:
    file: login.yaml
    env:
      NIVL_QA_EMAIL: ${NIVL_QA_EMAIL}
      NIVL_QA_PASSWORD: ${NIVL_QA_PASSWORD}
- assertNotVisible: '^Tu edad$'

# Reopening a completed account: no clearing storage/keychain between launches.
- repeat:
    times: 3
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: '^Hoy$'
          timeout: 30000
      - assertNotVisible: '^Tu edad$'

# A completed demo can explicitly open the existing route. Never reset production flags or Auth.
- openLink: 'nivl://onboarding'
- extendedWaitUntil:
    visible: '^Entrar en la arena$'
    timeout: 30000
- tapOn: '^Entrar en la arena$'
- tapOn: '^Tu nombre$'
- eraseText: 100
- inputText: 'Gladiador QA'
- hideKeyboard
- tapOn: '^Continuar$'
- tapOn: '^En general$'
- tapOn: '^Continuar$'
- assertVisible:
    text: '^Mi objetivo incluye salud o entrenamiento$'
    checked: false
- tapOn: '^Tu objetivo, en una frase$'
- inputText: 'Leer doce libros de ficcion'
- hideKeyboard
- tapOn: '^Continuar$'

# These are initially selected by saveKind. Unselect all visible proposals, including
# health proposals if this demo already has health consent; do not accept a new consent.
- runFlow:
    when:
      visible: '^Entrenar$'
    commands:
      - tapOn: '^Entrenar$'
- tapOn: '^Trabajo o estudio 2 h$'
- runFlow:
    when:
      visible: '^Registrar comidas del día$'
    commands:
      - tapOn: '^Registrar comidas del día$'
- tapOn: '^Leer 20 minutos$'
- runFlow:
    when:
      visible: '^Diario del día$'
    commands:
      - tapOn: '^Diario del día$'
- assertVisible: '^Empezar sin misiones$'
- tapOn: '^Empezar sin misiones$'
- scrollUntilVisible:
    element:
      text: '^Escribe tu nombre$'
    direction: DOWN
    timeout: 10000

# Original App Review trigger: tapping the blocked label focuses the empty field.
- tapOn: '^Escribe tu nombre$'
- assertVisible:
    text: '^Escribe tu nombre para firmar$'
    focused: true
- takeScreenshot: '${QA_EVIDENCE_ROOT}/qa-01-empty-label-focus'
- inputText: 'Nombre equivocado'
- hideKeyboard
- longPressOn: '^Escribe tu nombre$'
- assertVisible:
    text: '^Escribe tu nombre para firmar$'
    focused: true
- hideKeyboard
- assertVisible: '^Escribe tu nombre$'
- assertNotVisible: '^Sellado\..*'
- assertNotVisible: '^Firmado\. Ahora, quién lo dirige\.$'

# Valid signature, but a short release must not seal or advance.
- tapOn: '^Escribe tu nombre$'
- assertVisible:
    text: '^Escribe tu nombre para firmar$'
    focused: true
- eraseText: 100
- inputText: 'Gladiador QA'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: '^Mantén pulsado para firmar$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Mantén pulsado para firmar$'
- assertVisible: '^Mantén pulsado para firmar$'
- assertNotVisible: '^Sellado\..*'
- assertNotVisible: '^Firmado\. Ahora, quién lo dirige\.$'
- takeScreenshot: '${QA_EVIDENCE_ROOT}/qa-02-short-release-not-signed'

# Resume after backgrounding a canceled gesture. This is NOT background-during-hold evidence.
- pressKey: home
- launchApp:
    stopApp: false
- assertVisible: '^Mantén pulsado para firmar$'
- assertNotVisible: '^Sellado\..*'
- longPressOn: '^Mantén pulsado para firmar$'
- extendedWaitUntil:
    visible: '^(Hoy|Seguir gratis por ahora|Entrar en la arena)$'
    timeout: 30000
- runFlow:
    when:
      visible: '^Seguir gratis por ahora$'
    commands:
      - tapOn: '^Seguir gratis por ahora$'
- runFlow:
    when:
      visible: '^Entrar en la arena$'
    commands:
      - tapOn: '^Entrar en la arena$'
- extendedWaitUntil:
    visible: '^Hoy$'
    timeout: 30000
- assertNotVisible: '^Tu edad$'
- takeScreenshot: '${QA_EVIDENCE_ROOT}/qa-03-valid-hold-completed'
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '^Hoy$'
    timeout: 30000
- assertNotVisible: '^Tu edad$'
- takeScreenshot: '${QA_EVIDENCE_ROOT}/qa-04-cold-reopen-completed'
