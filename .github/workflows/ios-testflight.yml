# NIVL · Build de iOS a TestFlight sin gastar cupo de EAS.
#
# EAS Build limita los builds en la nube (15 de iOS al mes en el plan
# gratuito), pero lo que limita es el alquiler de SUS Mac. `eas build --local`
# compila en la máquina donde se ejecuta —aquí, el runner macOS de GitHub— y
# no cuenta para ese cupo. En un repo público los minutos de Actions son
# ilimitados; en uno privado, macOS cuenta ×10 (unos 7 builds al mes).
#
# Sigue usando EAS para lo que es gratis y ya está montado: los certificados y
# el perfil de firma (viven en los servidores de EAS y se bajan con
# EXPO_TOKEN), las variables del entorno `production`, el contador de build
# remoto y `eas submit`, que sube a TestFlight con la clave de App Store
# Connect guardada allí. Ninguna credencial de Apple pasa por este repo.
#
# Único secreto necesario: EXPO_TOKEN (expo.dev → Account settings → Access
# tokens), en Settings → Secrets and variables → Actions.
#
# Se lanza A MANO (Actions → iOS a TestFlight → Run workflow). Solo quien tiene
# permiso de escritura puede dispararlo, y los PR de forks no ven secretos.

name: iOS a TestFlight

on:
  workflow_dispatch:
    inputs:
      enviar:
        description: Subir a TestFlight al terminar
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '0'
    steps:
      - name: Falta el token
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "::error::Falta el secreto EXPO_TOKEN en Settings → Secrets and variables → Actions."
          exit 1

      - uses: actions/checkout@v4

      # La misma versión que fija eas.json: trae npm 10, que es el que casa con
      # el lockfile (ver AGENTS.md, "El lockfile se genera con npm 10").
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      # Expo SDK 54 (RN 0.81) pide Xcode 16.1 o superior.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - run: npm install --global eas-cli@latest

      - name: Compilar en este runner
        run: |
          eas build --platform ios --profile production --local \
            --non-interactive --output "$RUNNER_TEMP/nivl.ipa"

      # El .ipa NO se sube como artefacto: en un repo público los artefactos
      # los puede descargar cualquiera.
      - name: Subir a TestFlight
        if: ${{ inputs.enviar }}
        run: |
          eas submit --platform ios --profile production \
            --path "$RUNNER_TEMP/nivl.ipa" --non-interactive
