name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancela solo repeticiones del mismo contexto: PR y push validan commits distintos.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Versión y revisión comprobadas
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { expo } = require('./app.json');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `NIVL ${expo.version}\n\nCommit: \`${process.env.GITHUB_SHA}\`\n`);
          NODE
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci --runInBand
      - name: Lint
        run: npm run lint
      - name: Backend tests
        run: npx --yes deno@2.9.6 test --allow-read --allow-env supabase/functions/_shared supabase/functions/coach/deadline_test.ts
      - name: Backend typecheck
        run: npx --yes deno@2.9.6 check supabase/functions/coach/index.ts supabase/functions/account-erasure/index.ts supabase/functions/store-reconcile/index.ts supabase/functions/revenuecat-webhook/index.ts supabase/functions/store-erasure-cleanup/index.ts
