# NIVL · AAB de Android para la prueba cerrada de Google Play, sin gastar cupo de EAS.
#
# Mismo planteamiento que ios-testflight.yml: `eas build --local` compila en el
# runner y EAS solo pone la firma, las variables de `production` y el contador
# de versionCode. Único secreto: EXPO_TOKEN.
#
# Se lanza con un push a una rama `android/**` (así no hace falta tocar la rama
# por defecto) o a mano desde Actions si el archivo ya está en ella.
#
# No hay cuenta de servicio de Google en EAS, así que `eas submit` no sirve: el
# AAB sale como artefacto y se sube a mano en Play Console. En un repo público
# cualquiera con cuenta de GitHub puede bajarlo mientras exista; por eso dura
# solo 3 días. Lleva lo mismo que recibe un tester (nada de la clave de firma).

name: Android a Play (AAB)

on:
  push:
    branches:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '0'
    steps:
      - name: Falta el token
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "::error::Falta el secreto EXPO_TOKEN en Settings → Secrets and variables → Actions."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Memoria para Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties
          echo 'org.gradle.daemon=false' >> ~/.gradle/gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

      - run: npm ci

      - run: npm install --global eas-cli@21.2.0

      - name: Compilar el AAB
        run: |
          eas build --platform android --profile production --local \
            --non-interactive --output "$RUNNER_TEMP/nivl.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: nivl-aab
          path: ${{ runner.temp }}/nivl.aab
          retention-days: 3
          if-no-files-found: error
