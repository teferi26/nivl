# Capturas de teléfono para Google Play con el arnés de datos ficticios (1.1).
# APK Release de la app real con el bundle id de capturas, sin cuenta ni red,
# fotografiado en un emulador pixel_2. No usa secretos y no sube nada a Play.
# El repo es público: el artefacto se puede descargar durante 3 días y solo
# lleva datos ficticios.

name: Capturas Google Play (emulador)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Sin uso: el commit es el de la rama desde la que se lanza'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: screenshots-android
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Memoria para Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties
          echo 'org.gradle.daemon=false' >> ~/.gradle/gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

      - run: npx -y npm@10.9.2 ci --ignore-scripts --no-audit --no-fund

      - name: Compilar APK de capturas
        run: node scripts/tienda/harness/android.mjs --construir --apk "$RUNNER_TEMP/nivl-capturas.apk"

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: node scripts/tienda/harness/android.mjs --capturar --apk "$RUNNER_TEMP/nivl-capturas.apk" --salida "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-play-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: warn
