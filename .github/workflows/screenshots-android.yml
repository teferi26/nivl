# .github/workflows/screenshots-android.yml (propuesta de NIVL - Tiendas, integrada por el coordinador)
# Capturas de teléfono para la ficha de Google Play en un emulador Android.
# Es el gemelo de screenshots.yml (iOS): mismo flujo de Maestro
# (e2e/maestro/capturas-108.yaml), misma cuenta demo de capturas y mismos
# secretos. Solo se lanza a mano. No sube nada a Play Console: las capturas
# quedan como artefacto y se suben con el usuario.
#
# Avisos:
# - El repo es PÚBLICO: los artefactos se pueden descargar durante
#   `retention-days`. Solo la cuenta demo de capturas, con datos ficticios.
#   Retención: 3 días.
# - Play exige que el lado largo no pase del doble del corto. Un Pixel 7
#   (1080×2400) NO vale. Por eso se usa el perfil `pixel_2` (1080×1920).
# - No compila el AAB de la prueba cerrada: genera un APK de capturas con el
#   mismo JS de integración y el entorno de producción. Necesita en eas.json el
#   perfil `screenshots` con `"android": { "buildType": "apk" }` (ver LEEME.md).
# - No publica OTA: la 1.0.8 sigue congelada mientras Apple revisa.

name: Capturas Google Play (emulador)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'SHA o rama de la que sacar las capturas'
        required: true
        default: 'winter2/integracion'

permissions:
  contents: read

concurrency:
  group: screenshots-android
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: 2.10.0
    steps:
      - name: Faltan secretos
        env:
          HAY_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
          HAY_EMAIL: ${{ secrets.NIVL_SHOTS_EMAIL != '' }}
          HAY_PASS: ${{ secrets.NIVL_SHOTS_PASSWORD != '' }}
        run: |
          if [ "$HAY_EXPO" != "true" ] || [ "$HAY_EMAIL" != "true" ] || [ "$HAY_PASS" != "true" ]; then
            echo "::error::Faltan EXPO_TOKEN, NIVL_SHOTS_EMAIL o NIVL_SHOTS_PASSWORD en los secretos del repo."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # El paquete «tools» ya no existe en el sdkmanager actual y hace fallar el paso.
          packages: 'platform-tools'

      - name: "Memoria para Gradle (evita OutOfMemoryError Metaspace en ksp)"
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties
          echo 'org.gradle.daemon=false' >> ~/.gradle/gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' >> ~/.gradle/gradle.properties

      - run: npm ci
      - run: npm install --global eas-cli@21.2.0

      - name: Compilar APK de capturas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile screenshots --local \
            --non-interactive --output "$RUNNER_TEMP/nivl-capturas.apk"

      # Mismo zip y misma huella que en screenshots.yml (cli-2.10.0).
      - name: Instalar Maestro
        env:
          MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/maestro-cli"
          echo "$HOME/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      # KVM para que el emulador vaya acelerado en los runners de Linux.
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturas
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NIVL_SHOTS_EMAIL: ${{ secrets.NIVL_SHOTS_EMAIL }}
          NIVL_SHOTS_PASSWORD: ${{ secrets.NIVL_SHOTS_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put system system_locales es-ES
            adb shell cmd uimode night yes
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb install -r "$RUNNER_TEMP/nivl-capturas.apk"
            maestro test -e NIVL_QA_EMAIL="$NIVL_SHOTS_EMAIL" -e NIVL_QA_PASSWORD="$NIVL_SHOTS_PASSWORD" -e SLUG=android --test-output-dir "$RUNNER_TEMP/shots/android" e2e/maestro/capturas-108.yaml

      # Play: PNG o JPEG, lados entre 320 y 3840 y el largo no más del doble del corto.
      - name: Comprobar tamaños (1080×1920)
        run: |
          set -euo pipefail
          fallos=0
          for f in $(find "$RUNNER_TEMP/shots" -name 'capt-*.png'); do
            medida=$(python3 -c "import struct,sys;d=open(sys.argv[1],'rb').read(24);print('%dx%d'%struct.unpack('>II',d[16:24]))" "$f")
            if [ "$medida" != "1080x1920" ]; then echo "::error::$f mide $medida, se esperaba 1080x1920"; fallos=1; fi
          done
          exit $fallos

      - uses: actions/upload-artifact@v4
        with:
          name: capturas-play-${{ github.run_number }}
          path: ${{ runner.temp }}/shots/**/capt-*.png
          retention-days: 3
          if-no-files-found: error
