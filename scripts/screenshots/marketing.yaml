appId: com.teferi.nivl.screenshots
name: Native NIVL marketing screenshots
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: '.*Buenos días, Alex.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 01-hoy
- scrollUntilVisible:
    element:
      text: '(?i)Misiones de hoy'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 01-misiones
- tapOn: '^Agenda$'
- extendedWaitUntil:
    visible: 'Vista por semana'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 02-plan
- tapOn: '^Coach$'
- extendedWaitUntil:
    visible: '.*Ejemplo.*'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 03-coach
- tapOn: '^Hoy$'
- scrollUntilVisible:
    element:
      text: '^Abrir Gym$'
    direction: DOWN
    centerElement: true
- tapOn: '^Abrir Gym$'
- extendedWaitUntil:
    visible: 'Gimnasio'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 04-gym
- tapOn: '^Volver$'
- scrollUntilVisible:
    element:
      text: '^Abrir Economía$'
    direction: DOWN
    centerElement: true
- tapOn: '^Abrir Economía$'
- extendedWaitUntil:
    visible: '^Economía$'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 05-dinero
- tapOn: '^Volver$'
- scrollUntilVisible:
    element:
      text: '^Abrir Amigos$'
    direction: UP
    centerElement: true
- tapOn: '^Abrir Amigos$'
- extendedWaitUntil:
    visible: '^Amigos$'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 06-amigos
- scrollUntilVisible:
    element:
      text: '(?i)Ranking'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: 06-ranking
- scrollUntilVisible:
    element:
      text: '^Volver$'
    direction: UP
- tapOn: '^Volver$'
- scrollUntilVisible:
    element:
      text: '^Abrir Avances$'
    direction: DOWN
    centerElement: true
- tapOn: '^Abrir Avances$'
- extendedWaitUntil:
    visible: '^Avances$'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 07-avances
- tapOn: '^Volver$'
- tapOn: '^Hábitos$'
- waitForAnimationToEnd
- takeScreenshot: 09-habitos
